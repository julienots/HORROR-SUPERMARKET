plugins { id 'com.android.application' }

android {
    namespace 'com.superessence.lastmarket'
    compileSdk 35

    defaultConfig {
        applicationId 'com.superessence.lastmarket'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // Le jeu web compilé (game/dist) est copié dans les assets par la tâche syncGameAssets.
    sourceSets { main { assets.srcDirs = ['build/generated/gameAssets'] } }
    androidResources { noCompress += ['js', 'json', 'html'] }
    lint { checkReleaseBuilds false; abortOnError false }
}

tasks.register('syncGameAssets', Copy) {
    from "${rootDir}/../game/dist"
    into "${buildDir}/generated/gameAssets/game"
}
preBuild.dependsOn syncGameAssets

